# Checks whether the generated MAP.md content matches the current project
# structure. Copy this file to .github/workflows/check-maps.yml.
#
# Single-repo setup: remove --all; `claude-mapper check` alone checks the
# repository the workflow runs in.
# NOTE: `npx claude-mapper` uses the package version published on npm.
# Before an updated release, test this source checkout locally with:
# node bin/claude-mapper.mjs check --all

name: Check navigation maps

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check MAP.md is up to date
        run: npx claude-mapper check --all
        # For a multi-repo workspace where sub-repos are checked out as
        # sibling folders, add: --match "^my-org-"